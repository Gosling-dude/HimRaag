plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("local.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.sumitchauhan.himraag"
    // Google Play requires new apps and updates to target API 36 from
    // 2026-08-31. compileSdk must match so the API-36 behaviour changes
    // (edge-to-edge enforcement, FGS rules) compile against the real SDK.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.sumitchauhan.himraag"
        minSdk 24
        // Google Play target-API floor for new apps and updates submitted on or
        // after 2026-08-31 is Android 16 / API 36. Do not lower this.
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // A release artifact must be signed with the real upload keystore. Silently
    // falling back to the debug key produces an AAB that Play rejects (or, worse,
    // that installs locally and hides the problem until upload). Resolve the
    // keystore once here and refuse to build release without it.
    def releaseKeystore = keystoreProperties["keystoreFile"] ? file(keystoreProperties["keystoreFile"]) : null
    def hasReleaseKeystore = releaseKeystore != null && releaseKeystore.exists()

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties["keystoreAlias"]
                keyPassword keystoreProperties["keystorePassword"]
                storeFile releaseKeystore
                storePassword keystoreProperties["keystoreStorePassword"]
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            // Fail at execution time rather than configuration time so that debug
            // builds still work on machines that do not hold the upload keystore.
            if (!hasReleaseKeystore) {
                gradle.taskGraph.whenReady { graph ->
                    if (graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
                        throw new GradleException(
                            "Release signing keystore not found" +
                            (releaseKeystore ? " at ${releaseKeystore}" : " (keystoreFile unset)") +
                            ".\nSet keystoreFile, keystoreAlias, keystorePassword and " +
                            "keystoreStorePassword in android/local.properties.\n" +
                            "Refusing to debug-sign a release build.")
                    }
                }
            }
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

flutter {
    source "../.."
}
